<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid/Shield Pattern -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />

  <!-- EARNERS Emblem - Stylized Geometric E & Upward Growth Arrow -->
  <g transform="translate(106, 116)">
    <!-- Vertical Bar of E -->
    <rect x="0" y="0" width="60" height="280" rx="16" fill="url(#goldGrad)" />
    
    <!-- Top Bar of E -->
    <rect x="50" y="0" width="180" height="56" rx="16" fill="url(#goldGrad)" />
    
    <!-- Middle Bar of E with Arrow Accent -->
    <path d="M 50 112 L 180 112 C 190 112 198 120 198 130 L 198 150 C 198 160 190 168 180 168 L 50 168 Z" fill="url(#goldAccent)" />
    
    <!-- Bottom Bar of E -->
    <rect x="50" y="224" width="200" height="56" rx="16" fill="url(#goldGrad)" />
    
    <!-- Upward Skill Sparkle / Arrow Icon -->
    <path d="M 230 40 L 270 40 L 270 0 L 300 50 L 270 100 L 270 60 L 230 60 Z" fill="#FCD34D" opacity="0.9" />
  </g>
</svg>
